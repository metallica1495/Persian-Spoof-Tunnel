name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash installer
        run: bash -n install.sh
      - name: Validate Python web panel
        run: python3 -m py_compile panel/app.py
